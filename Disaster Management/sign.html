<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityLert - Sign Up</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('https://static.vecteezy.com/system/resources/previews/006/879/260/original/modern-abstract-wave-fluid-background-vector.jpg');
      background-size: cover;
      background-position: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
    }

    .signup-container {
      width: 100%;
      max-width: 500px;
      padding: 40px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
      color: #1abc9c;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 5px;
      background-color: #1abc9c;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #16a085;
    }

    .link {
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .link a {
      color: #1abc9c;
      text-decoration: none;
    }

    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h1>Sign Up</h1>
    <form id="signup-form">
      <input type="text" id="full-name" placeholder="Full Name" required />
      <input type="text" id="username" placeholder="Username" required />
      <input type="tel" id="phone" placeholder="Phone Number" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="text" id="location" placeholder="Location" required />
      <input type="password" id="password" placeholder="Password" required />
      <input type="password" id="confirm-password" placeholder="Confirm Password" required />
      <button type="submit">Sign Up</button>
    </form>
    <div class="link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script>
    document.getElementById("signup-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const fullName = document.getElementById("full-name").value.trim();
      const username = document.getElementById("username").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const location = document.getElementById("location").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      // Get existing users
      let users = JSON.parse(localStorage.getItem("users")) || [];

      // Check if username already exists
      if (users.some(user => user.username === username)) {
        alert("Username already exists.");
        return;
      }

      // Add new user
      users.push({ fullName, username, phone, email, location, password });

      // Save to localStorage
      localStorage.setItem("users", JSON.stringify(users));

      alert("Sign-up successful! Redirecting to login...");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
