<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityLert - Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('https://static.vecteezy.com/system/resources/previews/006/879/260/original/modern-abstract-wave-fluid-background-vector.jpg');
      background-size: cover;
      background-position: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      background-color: rgba(0, 0, 0, 0.85);
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ddd;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background-color: #1abc9c;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .error-message {
      color: #e74c3c;
      margin-top: 10px;
      display: none;
    }

    .link {
      margin-top: 20px;
    }

    .link a {
      color: #1abc9c;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button onclick="validateLogin()">Login</button>
    <p class="error-message" id="error-message">Invalid credentials</p>
    <div class="link">
      <p>Don't have an account? <a href="sign.html">Sign Up</a></p>
    </div>
  </div>

  <script>
    function validateLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMessage = document.getElementById("error-message");
      errorMessage.style.display = "none";

      const users = JSON.parse(localStorage.getItem("users") || "[]");

      const matchedUser = users.find(user => user.username === username && user.password === password);

      if (matchedUser) {
        alert("Login successful!");
        window.location.href = "main.html"; // Redirect to dashboard
      } else {
        errorMessage.style.display = "block";
      }
    }
  </script>
</body>
</html>
